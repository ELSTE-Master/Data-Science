<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="385" viewBox="0 0 1280 385" role="img" aria-labelledby="title desc">
<title id="title">An experimental rock becomes a source of chemical information</title>
<desc id="desc">Illustrative piston-cylinder cutaway. A piston compresses a solid pressure assembly; a furnace heats a capsule containing starting material. Clinopyroxene-bearing products form or equilibrate at controlled temperature and pressure. After recovery, a polyphase product is examined and a clinopyroxene grain is enlarged to illustrate chemical analysis. This is one example of experimental petrology; methods differ among studies.</desc>
<!-- Original schematic, not to scale. Scientific context: ETH Zurich, Piston
     Cylinders (https://highpressure.ethz.ch/facilities/experimental/piston-cylinders.html),
     GFZ, Piston Cylinder Press (https://www.gfz.de/en/section/chemistry-and-physics-of-earth-materials/infrastructure/piston-cylinder-press/).
     Neither source is claimed as attribution of the pinned teaching dataset. -->
