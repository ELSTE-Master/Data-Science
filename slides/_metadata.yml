license: "CC BY-NC-SA 4.0"
format: 
  clean-revealjs:
    background: '#fafafa'
    chalkboard: true
    highlight-style: atom-one
    callout-appearance: simple
    transition: fade
    transition-speed: fast
    code-annotations: hover
    css: [assets/slides.css, ../assets/slides-images.css]
    include-after-body: assets/after-body.html
    verticator:
      themetag: h1
      tooltip: title
      scale: 0.75
    fontawesome: true
    pdf: true
    mermaid:
      theme: 'default'

revealjs-plugins:
  - verticator
