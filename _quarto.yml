  #   right:
  #     - icon: github
  #       href: https://github.com/
  #       aria-label: GitHub
bibliography: references.bib



format:
  html:
    theme:
      light: cosmo
    code-fold: false
    css: custom.css
    backgroundcolor: "#fafafa"
    toc: true          # enable TOC
    toc-depth: 4       # how many heading levels to include
    toc-location: right
    toc-title: "On this page"
    toc-expand: 1      # how much to auto-expand initially
    resources:
    - class3/class_3_slides.pdf
    - class1/class_1_slides_intro.pdf
    - class1/class_1_slides_pandas.pdf
    - class2/class_2_slides_EDA.pdf
    - class4/class_4_slides.pdf
