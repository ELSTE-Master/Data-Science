project:
  type: website
  
website:
  title: "ELSTE Data Science Master Course"
  description: "An introduction to data science using Python"
  page-navigation: true
  search:
    location: sidebar
  sidebar:
    style: "floating"
    title: "ELSTE Data Science Course" 
    tools:     
      - icon: github
        href: https://github.com/ELSTE-Master/Data-Science
        text: "GitHub"
    background: "#fafafa"
    collapse-level: 1
    search: true
    contents: 
      - index.qmd
      - section: "Class 1: Pandas"
        contents:
          - class1/day1-1_intro.qmd
          - class1/day1-2_pandas.qmd
          - class1/day1-3_data_exploration.qmd
          - class1/day1-4_queries.qmd
          - class1/day1-5_filtering.qmd
          - class1/day1-6_operations.qmd
          - class1/day1-summary.qmd
      - section: "Class 2: Descriptive stats"
        contents:
          - class2/day2-1_intro.qmd
          - class2/day2-2_data_exploration.qmd
          - class2/day2-3_univariate.qmd
          - class2/day2-4_bivariate.qmd
      - section: "Class 3: Analysis of variance"
        contents:
          - class3/class_3_intro.qmd
          - class3/class_3_ex_1.qmd
          - class3/class_3_ex_2.qmd
          - class3/class_3_ex_3.qmd
          - class3/class_3_ex_4.qmd
          - class3/class_3_ex_5.qmd
      - section: "Class 4: Linear regression"
        contents:
          - class4/class_4_intro.qmd
          - class4/class_4_ex_1.qmd
          - class4/class_4_ex_2.qmd
          - class4/class_4_ex_3.qmd
          - class4/class_4_ex_4.qmd
      - section: "Appendices"
        contents:
          - appendices/setup_vscode.qmd
          - appendices/jupyter_markdown_summary.qmd
      # - references.qmd
  page-footer:
    background: "#fafafa"
    center: "© 2025 - [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/legalcode.en) - Sébastien Biass & Stéphane Guerrier"
